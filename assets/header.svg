<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" fill="none">
  <defs>
    <radialGradient id="gl" cx="425" cy="70" r="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7F52FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7F52FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="al" x1="175" y1="0" x2="675" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E31837" stop-opacity="0"/>
      <stop offset=".3" stop-color="#E31837" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#FFD700" stop-opacity=".8"/>
      <stop offset=".7" stop-color="#E31837" stop-opacity=".7"/>
      <stop offset="1" stop-color="#E31837" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes glowPulse{0%,100%{opacity:.35}50%{opacity:.9}}
    .name{animation:fadeIn 1.5s ease-out both}
    .role{animation:fadeIn 2s ease-out .4s both}
    .accent{animation:glowPulse 6s ease-in-out infinite}
    .dot{animation:fadeIn 1.2s ease-out both}
    .d1{animation-delay:.7s}
    .d2{animation-delay:.9s}
    .d3{animation-delay:1.1s}
  </style>
  <rect width="848" height="138" x="1" y="1" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect width="850" height="140" rx="10" fill="url(#gl)"/>
  <text class="name" x="425" y="54" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="40" font-weight="700" fill="#24292f" letter-spacing="3">JuDa Dev</text>
  <text class="role" x="425" y="86" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#57606a" letter-spacing="1.8">Software Developer</text>
  <rect class="accent" x="175" y="108" width="500" height="2" rx="1" fill="url(#al)"/>
  <circle class="dot d1" cx="393" cy="125" r="2.5" fill="#E31837" opacity=".8"/>
  <circle class="dot d2" cx="425" cy="125" r="3" fill="#FFD700" opacity=".9"/>
  <circle class="dot d3" cx="457" cy="125" r="2.5" fill="#E31837" opacity=".8"/>
</svg>
