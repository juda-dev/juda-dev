<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <defs>
    <filter id="blur1" x="20" y="25" width="40" height="40" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5" result="blur"/>
    </filter>
  </defs>
  
  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #24292f; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #57606a; }
    .line { stroke: #d0d7de; stroke-width: 2; }
    .dot-active { fill: #7F52FF; }
    .dot-past { fill: #ffffff; stroke: #7F52FF; stroke-width: 2; }
  </style>

  <!-- Timeline Line -->
  <line class="line" x1="40" y1="55" x2="40" y2="200" />

  <!-- Entry 1 -->
  <circle cx="40" cy="45" r="10" fill="#7F52FF" opacity="0.2" filter="url(#blur1)" />
  <circle class="dot-active" cx="40" cy="45" r="5" />
  <text class="title" x="70" y="42">Systems Engineering</text>
  <text class="subtitle" x="70" y="62">Currently Studying</text>

  <!-- Entry 2 -->
  <circle class="dot-past" cx="40" cy="115" r="4" />
  <text class="title" x="70" y="112">Technologist in Software Development</text>
  <text class="subtitle" x="70" y="132">Graduated</text>

  <!-- Entry 3 -->
  <circle class="dot-past" cx="40" cy="185" r="4" />
  <text class="title" x="70" y="182">Technician in Electrical Networks and Communications</text>
  <text class="subtitle" x="70" y="202">Graduated</text>
</svg>
